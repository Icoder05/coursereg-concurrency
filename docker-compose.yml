services:
  db:
    image: postgres:15
    container_name: studentdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studentdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: .
    container_name: go-student-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: studentdb
      DB_SSLMODE: disable
      HTTP_PORT: 8080
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    restart: always

  web:
    build: ./web
    container_name: student-dashboard
    depends_on:
      - service
    ports:
      - "3000:80"
    restart: always

volumes:
  pgdata:
